name: lohnn_podcast_workspace
workspace:
  - apps/podcast
  - packages/podcast_core
  - packages/podcast_common

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  collection: ^1.19.1
  glob: ^2.1.3
  html: ^0.15.6
  pubspec_parse: ^1.5.0

dev_dependencies:
  melos: ^7.3.0

melos:
  command:
    version:
      # Only allow versioning to happen on main branch.
      branch: main
    bootstrap:
      environment:
        sdk: ">=3.10.4 <4.0.0"
        flutter: 3.38.5
  
  scripts:
    generate:
      exec: dart run build_runner build -d
      description: Run code generation.
    slang:
      exec: dart run slang && dart run slang configure
      description: Generate slang file
      packageFilters:
        slang: true
